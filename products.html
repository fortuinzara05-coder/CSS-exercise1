<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Shop</h1>
        <p>Check out our best products</p>
    </header>

    <main>
        <!-- Card 1 -->
        <div class="card">
            <img src="https://plus.unsplash.com/premium_photo-1678099940967-73fe30680949?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Headphones">
            <h2>Headphones</h2>
            <p class="price">R499.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1587836374828-4dbafa94cf0e?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Watch">
            <h2>Watch</h2>
            <p class="price">R899.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Sneakers">
            <h2>Sneakers</h2>
            <p class="price">R1299.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 4 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1622560481156-01fc7e1693e6?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Backpack">
            <h2>Backpack</h2>
            <p class="price">R349.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 5 -->
        <div class="card">
            <img src="https://media.istockphoto.com/id/2205611968/photo/stylish-sunglasses-in-a-black-frame-isolated-on-white-background.webp?a=1&b=1&s=612x612&w=0&k=20&c=dRcckXV8ZoBUdVCnaNY2yhZ9PN-Yty5Sjjf0K5rzOWU=" alt="Sunglasses">
            <h2>Sunglasses</h2>
            <p class="price">R299.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 6 -->
        <div class="card">
            <img src="https://plus.unsplash.com/premium_photo-1664007549565-401a3220d12d?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Water Bottle">
            <h2>Water Bottle</h2>
            <p class="price">R199.99</p>
            <button>Add to Cart</button>
        </div>
    </main>

</body>
</html>
